<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>המוח תחת חקירה - הרשמה</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">🧠 המוח תחת חקירה</div>
    </header>

    <nav>
        <div class="nav-links">
            <a href="index.html">דף הבית</a>
            <a href="login.html">כניסת חוקרים</a>
            <a href="#" class="active">הרשמה</a>
            <a href="human-brain.html">המוח האנושי</a>
            <a href="how-it-works.html">איך המוח עובד</a>
            <a href="research.html">איך חוקרים את המוח</a>
            <a href="medical-cases.html">מקרים רפואיים</a>
        </div>
    </nav>

    <main>
        <h2>הרשמת חוקר חדש</h2>
        
        <div class="form-container">
            <h3 class="form-title">טופס יצירת חשבון חוקר</h3>
            
            <form action="#" method="POST">
                
                <div class="input-group">
                    <label for="reg-username">שם משתמש</label>
                    <input type="text" id="reg-username" name="Username" required>
                </div>

                <div class="input-group">
                    <label for="reg-password">סיסמה</label>
                    <input type="password" id="reg-password" name="Password" required>
                </div>
                <div class="input-group">
                    <label for="confirm-password">אימות סיסמה</label>
                    <input type="password" id="confirm-password" name="ConfirmPassword" required>
                </div>
                <div class="input-group">
                    <label for="first-name">שם פרטי</label>
                    <input type="text" id="first-name" name="Firstname" required>
                </div>
                <div class="input-group">
                    <label for="last-name">שם משפחה</label>
                    <input type="text" id="last-name" name="Lastname" required>
                </div>

                <div class="input-group">
                    <label for="city">עיר מגורים</label>
                    <input list="cities" id="city" name="City" required>
                    <datalist id="cities">
                        <option value="תל אביב">
                        <option value="ירושלים">
                        <option value="חיפה">
                        <option value="ראשון לציון">
                        <option value="פתח תקווה">
                        <option value="אשדוד">
                        <option value="נתניה">
                        <option value="באר שבע">
                        <option value="חולון">
                        <option value="רמת גן">
                    </datalist>
                </div>

                <div class="input-group">
                    <label for="phone">טלפון</label>
                    <div class="input-row">
                        <select id="phone-prefix" name="PhonePrefix" required>
                            <option value="050">050</option>
                            <option value="052">052</option>
                            <option value="053">053</option>
                            <option value="054">054</option>
                            <option value="055">055</option>
                            <option value="058">058</option>
                            <option value="02">02</option>
                            <option value="03">03</option>
                            <option value="04">04</option>
                            <option value="08">08</option>
                            <option value="09">09</option>
                        </select>
                        <input type="text" id="phone" name="Phone" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">מייל</label>
                    <input type="email" id="email" name="Email" required>
                </div>
                <div class="radio-group">
                    <label>מין</label>
                    <div class="radio-option">
                        <input type="radio" id="male" name="Gender" value="זכר" required>
                        <label for="male" style="display:inline;">זכר</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="female" name="Gender" value="נקבה">
                        <label for="female" style="display:inline;">נקבה</label>
                    </div>
                </div>

                <div class="checkbox-group">
                    <label>תחביבים</label>
                    <div class="checkbox-option">
                        <input type="checkbox" id="hobby1" name="Hobby1" value="קריאה">
                        <label for="hobby1" style="display:inline;">קריאה</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="hobby2" name="Hobby2" value="מחקר">
                        <label for="hobby2" style="display:inline;">מחקר</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="hobby3" name="Hobby3" value="ספורט">
                        <label for="hobby3" style="display:inline;">ספורט</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="hobby4" name="Hobby4" value="נגינה">
                        <label for="hobby4" style="display:inline;">נגינה</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="hobby5" name="Hobby5" value="מחשבים">
                        <label for="hobby5" style="display:inline;">מחשבים</label>
                    </div>
                </div>

                <div class="button-group">
                    <input type="submit" value="שלח" class="btn-submit">
                    <input type="reset" value="ניקוי" class="btn-reset">
                </div>
            </form>
        </div>
    </main>


</body>
</html>
